<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenShop</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="logo-container">
          <img src="images/Vector.png" alt="GreenShop logo" class="logo-icon" />
          <span class="logo-text">GREENSHOP</span>
        </div>

        <nav class="nav">
          <ul class="menu">
            <li class="menu-item"><a href="#" class="menu-link">Home</a></li>
            <li class="menu-item"><a href="#" class="menu-link">Shop</a></li>
            <li class="menu-item">
              <a href="#" class="menu-link">Plant Care</a>
            </li>
            <li class="menu-item"><a href="#" class="menu-link">Blogs</a></li>
          </ul>
        </nav>
        <a href="registration.html" class="login-btn">
          <img src="images/Logout.png" alt="Login icon" class="btn-icon" />
          Login</a
        >
      </div>
    </header>

    <section class="first">
      <div class="first-container">
        <div class="first-content">
          <p class="first-subtitle">WELCOME TO GREENSHOP</p>

          <h1 class="first-title">
            LET’S MAKE A <br />
            BETTER <span class="accent">PLANET</span>
          </h1>

          <p class="first-text">
            We are an online plant shop offering a wide range of cheap and
            trendy plants. Use our plants to create an unique Urban Jungle.
            Order your favorite plants!
          </p>

          <a href="#" class="first-btn">SHOP NOW</a>
        </div>

        <div class="first-image">
          <img src="images/012.png" alt="Plant" />
          <img src="images/011.png" alt="Plant" />
        </div>
      </div>
    </section>
  </body>
