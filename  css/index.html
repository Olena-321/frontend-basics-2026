<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="form-container">
      <form>
        <h2 class="title">
          Login | <span style="color: #46a358">Register</span>
        </h2>
        <p class="hint">Enter you email and password to register</p>
        <input
          type="text"
          id="fullname"
          name="fullname"
          placeholder="Username"
        />
        <input type="text" id="email" placeholder="Enter your email address" />
        <input type="text" id="password" placeholder="Password" />
        <input
          type="text"
          name="сonfirm-password"
          placeholder="Confirm Password"
        />

        <button type="submit" class="submit-button">Register</button>
      </form>
      <div class="social-container">
        <span class="center-text">Or register with</span>

        <button type="button" class="social-button">
          <img src="./images/google1.png" alt="Google" class="icon" />
          Continue with Google
        </button>

        <button type="button" class="social-button">
          <img src="./images/facebook1.png" alt="Facebook" class="icon" />
          Continue with Facebook
        </button>
      </div>
    </main>
    <footer class="footer"></footer>
  </body>
</html>
